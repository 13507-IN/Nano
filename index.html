<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f8">
    <meta name="description" content="An exam-focused, visual study workspace for nanotechnology and nanoelectronics.">
    <title>Study Nano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Course navigation">
        <a class="brand" href="#home" data-route="home" aria-label="Study Nano course map">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="3.2" fill="currentColor"/>
            <ellipse cx="20" cy="20" rx="15" ry="6.5" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-36 20 20)"/>
            <ellipse cx="20" cy="20" rx="15" ry="6.5" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(36 20 20)"/>
          </svg>
          <span><strong>Study Nano</strong><small>Nanotechnology &amp; nanoelectronics</small></span>
        </a>

        <div class="sidebar-group">
          <p class="nav-heading">Study</p>
          <a class="nav-link is-active" href="#home" data-route="home">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8"/></svg>
            <span>Course map</span>
          </a>
          <a class="nav-link" href="#recall" data-route="recall">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8 12 7l4.6.7-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2L8 7z"/></svg>
            <span>Recall lab</span>
            <span class="nav-count" id="quiz-count">12</span>
          </a>
        </div>

        <div class="sidebar-group topic-group">
          <p class="nav-heading">Syllabus</p>
          <nav id="topic-nav" class="topic-nav" aria-label="Syllabus topics"></nav>
        </div>

        <div class="sidebar-bottom">
          <div class="progress-summary">
            <div class="progress-copy"><span>Course progress</span><strong id="sidebar-progress">0%</strong></div>
            <div class="progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="sidebar-progress-bar"><span></span></div>
            <small id="sidebar-progress-detail">0 of 15 chapters complete</small>
          </div>
          <button class="nav-link utility-link" id="saved-link" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h10v13l-5-3-5 3z"/></svg>
            <span>Saved chapters</span>
          </button>
        </div>
      </aside>

      <header class="topbar">
        <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Open course navigation" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        </button>
        <span class="mobile-brand">Study Nano</span>
        <label class="search-box" for="site-search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.5"/><path d="m13 13 4 4"/></svg>
          <input id="site-search" type="search" placeholder="Search concepts, equations, exam cues" autocomplete="off" aria-label="Search all study notes">
          <kbd>Ctrl K</kbd>
        </label>
        <div class="topbar-actions">
          <button class="icon-button" id="text-smaller" type="button" aria-label="Decrease reading text size" title="Smaller text">A−</button>
          <button class="icon-button" id="text-larger" type="button" aria-label="Increase reading text size" title="Larger text">A+</button>
          <button class="focus-button" id="focus-mode" type="button" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.2 3.5H4.5v2.7M12.8 3.5h2.7v2.7M7.2 16.5H4.5v-2.7M12.8 16.5h2.7v-2.7"/></svg>
            <span>Focus</span>
          </button>
        </div>
        <div class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></div>
      </header>

      <main class="workspace" id="workspace">
        <div class="loading-state" id="loading-state">
          <span class="loading-line"></span>
          <span class="loading-line short"></span>
          <p>Opening the course notes…</p>
        </div>
        <div id="view-root" aria-live="polite"></div>
      </main>
    </div>
    <div class="mobile-scrim" id="mobile-scrim" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
