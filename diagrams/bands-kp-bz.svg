<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Kronig–Penney potential and Brillouin zone bands</title>
  <desc id="desc">Left: a periodic barrier and well potential. Right: schematic allowed bands and a forbidden gap within the first one-dimensional Brillouin zone.</desc>
  <rect width="1120" height="520" fill="#fbfcfe"/>
  <text x="34" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#14243a">Periodic potential → Bloch states → bands and gaps</text>
  <rect x="28" y="66" width="500" height="408" rx="14" fill="#fff" stroke="#d9e2ee"/>
  <rect x="552" y="66" width="540" height="408" rx="14" fill="#fff" stroke="#d9e2ee"/>
  <text x="54" y="99" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14243a">A. Kronig–Penney model</text>
  <text x="578" y="99" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14243a">B. Reduced-zone E(k) picture</text>
  <g stroke="#586b82" stroke-width="2" fill="none">
    <path d="M80 405V145 M80 405H490"/>
    <path d="M80 330H150V200H205V330H275V200H330V330H400V200H455V330"/>
    <path d="M590 405V145 M590 405H1058"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" fill="#53647a">
    <text x="63" y="154">V(x)</text><text x="478" y="427">x</text>
    <text x="588" y="154">E</text><text x="1045" y="427">k</text>
    <text x="105" y="350" fill="#17827a">well</text>
    <text x="156" y="188" fill="#c05849">barrier</text>
    <text x="205" y="458">a</text><text x="335" y="458">a</text><text x="465" y="458">a</text>
    <text x="763" y="429">−π/a</text><text x="851" y="429">0</text><text x="970" y="429">+π/a</text>
  </g>
  <g stroke="#d7e0eb" stroke-dasharray="5 5">
    <path d="M760 145V405 M990 145V405"/>
  </g>
  <g fill="none" stroke-width="5">
    <path d="M760 323 Q875 386 990 323" stroke="#17827a"/>
    <path d="M760 236 Q875 169 990 236" stroke="#4267a9"/>
    <path d="M760 169 Q875 125 990 169" stroke="#d28b35"/>
  </g>
  <g stroke="#d7e0eb" stroke-width="1">
    <path d="M590 323H1058 M590 236H1058 M590 169H1058"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" fill="#53647a">
    <text x="1004" y="327" fill="#17827a">band 1</text>
    <text x="1004" y="240" fill="#4267a9">band 2</text>
    <text x="1004" y="173" fill="#d28b35">band 3</text>
    <text x="836" y="286" fill="#c05849" font-weight="700">forbidden gap</text>
    <text x="825" y="483">first Brillouin zone</text>
  </g>
  <path d="M918 278L965 245" stroke="#c05849" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c05849"/>
    </marker>
  </defs>
  <g font-family="Arial,sans-serif" font-size="13" fill="#53647a">
    <text x="54" y="450">V(x + a) = V(x)</text>
    <text x="54" y="468">Allowed E: |right-hand side| ≤ 1</text>
    <text x="578" y="450">Zone edge: k = ±π/a</text>
    <text x="578" y="468">Bragg coupling splits states and opens a gap.</text>
  </g>
</svg>
